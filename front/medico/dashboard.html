<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi Panel — Médico | MedEstudios</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>

<div class="app-wrapper">
  <!-- Sidebar -->
  <nav class="sidebar" id="sidebar">
    <a class="sidebar-brand" href="dashboard.html">
      <div class="sidebar-brand-icon"><i class="bi bi-hospital"></i></div>
      <div>
        <div class="sidebar-brand-text">MedEstudios</div>
        <div class="sidebar-brand-sub">Portal Médico</div>
      </div>
    </a>
    <div class="sidebar-nav">
      <a href="dashboard.html"  class="nav-link"><i class="bi bi-speedometer2"></i> Mi Panel</a>
      <a href="pacientes.html"  class="nav-link"><i class="bi bi-people"></i> Mis Pacientes</a>
      <a href="estudios.html"   class="nav-link"><i class="bi bi-file-earmark-medical"></i> Mis Estudios</a>
      <div class="sidebar-divider"></div>
      <button class="nav-link btn-logout w-100 text-start border-0 bg-transparent text-danger">
        <i class="bi bi-box-arrow-left"></i> Cerrar Sesión
      </button>
    </div>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="sidebar-user-avatar" id="sidebar-user-avatar">--</div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name" id="sidebar-user-name">…</div>
          <div class="sidebar-user-role" id="sidebar-user-role">…</div>
        </div>
      </div>
    </div>
  </nav>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <!-- Main -->
  <div class="main-content">
    <header class="top-header">
      <button class="hamburger-btn" id="sidebar-toggle"><i class="bi bi-list"></i></button>
      <h1 class="page-title"><i class="bi bi-speedometer2 me-2 text-primary"></i>Mi Panel</h1>
      <span class="d-none d-md-inline text-muted" style="font-size:0.85rem;" id="header-user-name"></span>
    </header>

    <div class="page-body">
      <p class="text-muted mb-4">Bienvenido/a. Aquí encontrará un resumen de su actividad.</p>

      <div class="row g-3 mb-4">
        <div class="col-12 col-sm-6">
          <div class="stat-card">
            <div class="stat-icon bg-success"><i class="bi bi-people"></i></div>
            <div>
              <div class="stat-value" id="stat-pacientes">—</div>
              <div class="stat-label">Mis Pacientes Activos</div>
            </div>
          </div>
        </div>
        <div class="col-12 col-sm-6">
          <div class="stat-card">
            <div class="stat-icon bg-warning"><i class="bi bi-file-earmark-medical"></i></div>
            <div>
              <div class="stat-value" id="stat-estudios">—</div>
              <div class="stat-label">Mis Estudios</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Quick links -->
      <div class="row g-3">
        <div class="col-12">
          <h5 class="fw-semibold text-secondary mb-3">Accesos rápidos</h5>
        </div>
        <div class="col-6 col-md-4 col-lg-3">
          <a href="pacientes.html" class="text-decoration-none">
            <div class="content-card p-3 text-center h-100" style="cursor:pointer;">
              <i class="bi bi-people fs-2 text-success d-block mb-2"></i>
              <div class="fw-semibold" style="font-size:.9rem;">Mis Pacientes</div>
            </div>
          </a>
        </div>
        <div class="col-6 col-md-4 col-lg-3">
          <a href="estudios.html" class="text-decoration-none">
            <div class="content-card p-3 text-center h-100" style="cursor:pointer;">
              <i class="bi bi-file-earmark-medical fs-2 text-warning d-block mb-2"></i>
              <div class="fw-semibold" style="font-size:.9rem;">Mis Estudios</div>
            </div>
          </a>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/api.js"></script>
<script src="../js/medico/dashboard.js"></script>
</body>
</html>
