server.port=8080

# JWT Configuration
app.jwt.secret=${JWT_SECRET:dev-secret-key-change-in-production-min-32-chars}
app.jwt.expiration=86400000

# H2 Database
spring.datasource.url=jdbc:h2:mem:medicaldb
spring.datasource.driverClassName=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update

# File Upload
app.upload.path=./uploads
app.upload.max-size=10485760

# Multipart
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

# Logging - never log sensitive data
logging.level.com.medical.api=INFO
logging.level.org.springframework.security=WARN
